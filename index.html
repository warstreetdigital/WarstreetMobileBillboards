<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="app-title">WarStreet Hub</title>
    <style id="base-styles">
        /* LUXURY HUB & MULTI-BRAND ENGINE */
        @import url('https://fonts.googleapis.com/css2?family=Prata&family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@1,400&display=swap');

        :root {
            --c-bg: #050505;
            --c-red: #8B1111;
            --c-red-glow: #B00000;
            --c-text: #F5F5F4;
            --f-display: 'Prata', serif;
            --f-body: 'Montserrat', sans-serif;
            --f-italic: 'Playfair Display', serif;
            --transition: 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--c-bg);
            color: var(--c-text);
            font-family: var(--f-body);
            height: 100vh;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }

        /* --- GLOBAL BACKGROUNDS --- */
        .background-stage {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .video-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            filter: grayscale(10%) contrast(1.1);
            transition: opacity 1.5s ease;
        }

        .atmosphere-overlay {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 20%, var(--c-overlay-1, rgba(255, 255, 255, 0.05)) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, var(--c-overlay-2, rgba(255, 255, 255, 0.02)) 0%, transparent 50%);
            mix-blend-mode: screen;
            z-index: 5;
            pointer-events: none;
            animation: drift 20s infinite alternate linear;
        }

        .guard-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, 
                rgba(5,5,5,0.8) 0%, 
                transparent 40%, 
                transparent 60%, 
                rgba(5,5,5,0.95) 100%);
            z-index: 6;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            z-index: 7;
            pointer-events: none;
        }

        /* --- STAGE WRAPPERS --- */
        /* CORE SYSTEM LOCKED 
           DO NOT MODIFY UNDER ANY CIRCUMSTANCE */
        .stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            z-index: 10;
            pointer-events: none;
        }

        .stage.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* --- STAGE 0: HUB --- */
        /* CORE SYSTEM LOCKED 
           DO NOT MODIFY UNDER ANY CIRCUMSTANCE */
        #stage-hub {
            position: absolute;
            inset: 0;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
            z-index: 50;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 120px;
            padding-bottom: 60px;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        #stage-hub::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 10% 10%, rgba(255,255,255,0.02) 0%, transparent 50%),
                        radial-gradient(circle at 90% 90%, rgba(255,255,255,0.01) 0%, transparent 50%);
            pointer-events: none;
            animation: hubDrift 20s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes hubDrift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(2%, 1%); }
        }

        .hub-header {
            margin-bottom: 60px;
            text-align: center;
            opacity: 0;
            animation: hubSlideIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 10;
        }

        @keyframes hubSlideIn {
            0% { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .hub-header-top {
            font-size: 10px;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            opacity: 0.3;
            margin-bottom: 8px;
        }

        .hub-title {
            font-family: var(--f-display);
            font-size: clamp(32px, 10vw, 54px);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
            margin-top: 40px;
            position: relative;
            z-index: 5;
        }

        .hub-header-sub {
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.5;
            font-weight: 300;
        }

        .hub-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 360px;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .hub-category-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            opacity: 0;
            margin: 40px 0 12px 0;
            text-align: left;
            width: 100%;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
            animation: hubSlideIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-link-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            width: 100%;
            opacity: 0;
            animation: hubSlideIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards, cardPulse 8s infinite alternate ease-in-out;
        }

        @keyframes cardPulse {
            0% { border-color: rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.03); }
            100% { border-color: rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.05); }
        }

        .brand-link-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--card-glow, #fff);
        }

        .brand-item-top {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 6px;
        }

        .brand-number {
            font-size: 11px;
            opacity: 0.3;
            letter-spacing: 0.3em;
            font-family: var(--f-body);
        }

        .brand-link-name {
            font-family: var(--f-display);
            font-size: 20px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .brand-link-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            opacity: 0.4;
            margin-bottom: 20px;
            font-weight: 300;
            margin-left: 38px;
        }

        .brand-link-cta {
            font-size: 9px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--card-glow, #fff);
            opacity: 0.6;
            margin-left: 38px;
            font-weight: 700;
        }

        .hub-footer {
            margin-top: 60px;
            margin-bottom: 30px;
            font-size: 9px;
            letter-spacing: 0.4em;
            opacity: 0.2;
            text-align: center;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
        }

        .network-status {
            position: fixed;
            top: 40px;
            right: 40px;
            font-size: 8px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            opacity: 0.2;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            pointer-events: none;
        }

        /* --- SEARCH SYSTEM --- */
        .hub-search-trigger {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }

        .hub-search-trigger:hover {
            opacity: 1;
        }

        #search-overlay {
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            z-index: 200;
            padding-top: 40px;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .search-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 18px;
            padding: 15px 0;
            font-family: var(--f-body);
            letter-spacing: 0.05em;
            outline: none;
        }

        #search-results-container {
            padding-top: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .search-empty {
            text-align: center;
            opacity: 0.3;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 60px;
        }

        .search-label {
            font-size: 9px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.3;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .network-dot {
            width: 4px;
            height: 4px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff00;
            animation: statusGlow 2s infinite alternate;
        }

        @keyframes statusGlow {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        /* --- STAGE 1: CINEMATIC LANDING --- */
        #stage-landing {
            padding: 40px;
            text-align: center;
        }

        .brand-top {
            position: absolute;
            top: 60px;
            opacity: 0;
            animation: slideDown 1.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-name {
            font-family: var(--f-display);
            font-size: 18px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 8px;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .hero-group {
            opacity: 0;
            animation: fadeInBlur 2.5s 0.5s forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title-top {
            font-family: var(--f-display);
            font-size: clamp(50px, 14vw, 100px);
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .hero-title-accent {
            font-family: var(--f-italic);
            font-style: italic;
            font-size: clamp(40px, 10vw, 80px);
            color: var(--c-red);
            margin-top: -15px;
            text-shadow: 0 0 40px var(--c-glow-color, rgba(139, 17, 17, 0.4));
            animation: glowPulse 4s infinite alternate;
        }

        /* --- STAGE 2: AD-STYLE BILLBOARD --- */
        #stage-billboard {
            z-index: 15;
            background: linear-gradient(135deg, #050505 0%, #1a0505 50%, #050505 100%);
            background-size: 400% 400%;
            animation: backgroundFlow 10s infinite ease-in-out;
        }

        @keyframes backgroundFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .billboard-visual-area {
            position: absolute;
            inset: 0;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .product-focus-glow {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, var(--c-scene-glow, rgba(139, 17, 17, 0.3)) 0%, transparent 70%);
            filter: blur(60px);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .product-focus-glow.active {
            opacity: 0.6;
        }

        .product-hero-container {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.05);
            width: 85%;
            max-width: 520px;
            aspect-ratio: 1/1.2;
            z-index: 35;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-hero-container.show {
            opacity: 1;
            animation: heroFloat 6s infinite alternate ease-in-out;
        }

        .product-hero-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.3));
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        .product-hero-container::after {
            content: '';
            position: absolute;
            inset: -30px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            z-index: -1;
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes heroFloat {
            0% { transform: translate(-50%, -50%) translateY(0) scale(1); }
            50% { transform: translate(-50%, -50%) translateY(-10px) scale(1.03); }
            100% { transform: translate(-50%, -50%) translateY(0) scale(1); }
        }

        .billboard-text {
            position: absolute;
            bottom: 22%;
            left: 0;
            right: 0;
            z-index: 40;
            text-align: center;
            padding: 0 40px;
        }

        .scene-label {
            font-size: 9px;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 12px;
            font-weight: 300;
        }

        .scene-title {
            font-family: var(--f-display);
            font-size: clamp(26px, 7vw, 38px);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            line-height: 1.1;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s 0.2s, transform 1s 0.2s;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .scene-title.show {
            opacity: 1;
            transform: translateY(0);
        }

        .scene-price {
            font-family: var(--f-body);
            font-size: 22px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #FFD700;
            margin-top: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1s 0.4s, transform 1s 0.4s;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .scene-price.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- PULSE OVERLAYS --- */
        .city-overlay {
            position: fixed;
            top: env(safe-area-inset-top, 40px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-size: 8px;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .universal-mode .city-overlay {
            opacity: 0.35;
        }

        .universal-indicator {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            font-size: 8px;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .universal-mode .universal-indicator {
            opacity: 0.25;
        }

        .pulse-entry {
            margin-top: 20px;
            font-size: 8px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            opacity: 0.4;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .pulse-entry:hover {
            opacity: 0.8;
        }

        .brand-tag-overlay {
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--c-red);
            margin-bottom: 8px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease;
        }

        .brand-tag-overlay.show {
            opacity: 1;
            transform: translateY(0);
        }

        .billboard-image-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out, transform 12s linear;
            z-index: 2;
        }

        .billboard-image-bg.show {
            opacity: 0.25;
            transform: scale(1.1);
        }

        /* --- BUTTONS --- */
        .btn-luxury {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 22px 48px;
            color: #fff;
            font-family: var(--f-body);
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-size: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            margin-top: 50px;
            box-shadow: 0 0 20px rgba(255,255,255,0.05);
        }

        .btn-luxury::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .btn-luxury.fixed-bottom {
            position: fixed;
            bottom: 50px;
            width: calc(100% - 80px);
            max-width: 340px;
            z-index: 100;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s 0.6s ease;
            pointer-events: none;
        }

        .btn-luxury.fixed-bottom.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn-fade {
            opacity: 0;
            animation: fadeIn 1.5s 1.5s forwards;
        }

        /* --- MODAL SYSTEM --- */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: flex-end; /* Mobile native drawer feel */
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-blur {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .modal-content {
            position: relative;
            z-index: 1001;
            width: 100%;
            max-width: 440px;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px 32px 0 0;
            padding: 40px 24px 60px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-section-title {
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.4;
            margin: 24px 0 12px 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: rgba(255,255,255,0.05);
        }

        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, background 0.3s ease;
            position: relative;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .product-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }

        .card-img-wrapper {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,0.04);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #fff;
        }

        .card-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .card-price {
            font-size: 12px;
            color: #fff;
            margin-top: 6px;
            letter-spacing: 0.1em;
            font-weight: 700;
            opacity: 0.9;
        }

        .social-links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .social-link-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;

        function renderSearchResults(query) {
            const container = document.getElementById('search-results-container');
            container.innerHTML = '';
            
            const recentKeys = JSON.parse(localStorage.getItem('recent_brands') || '[]');
            
            if (!query && recentKeys.length > 0) {
                const label = document.createElement('div');
                label.className = "search-label stagger-item";
                label.textContent = "Recently Viewed";
                container.appendChild(label);
                
                recentKeys.forEach(key => {
                    if (BRANDS[key]) appendResultCard(container, BRANDS[key], key);
                });
                return;
            }

            if (!query) {
                const label = document.createElement('div');
                label.className = "search-label stagger-item";
                label.textContent = "Suggested Experiences";
                container.appendChild(label);
                
                Object.keys(BRANDS).slice(0, 3).forEach(key => {
                    appendResultCard(container, BRANDS[key], key);
                });
                return;
            }

            const results = Object.keys(BRANDS).filter(key => {
                const b = BRANDS[key];
                const q = query.toLowerCase();
                const matchName = b.name.toLowerCase().includes(q);
                const matchCat = b.category.toLowerCase().includes(q);
                const matchScenes = b.scenes.some(s => s.title.toLowerCase().includes(q));
                const matchProds = b.scenes.some(s => s.products.some(p => p.name.toLowerCase().includes(q)));
                return matchName || matchCat || matchScenes || matchProds;
            });

            if (results.length === 0) {
                container.innerHTML = `<div class="search-empty stagger-item">No matching experiences found</div>`;
                return;
            }

            results.forEach(key => {
                appendResultCard(container, BRANDS[key], key);
            });
        }

            card.className = "brand-link-card stagger-item";

                    <div class="brand-link-name">${b.name}</div>
                </div>
                <div class="brand-link-label">${b.category}</div>
                <div class="brand-link-cta">ENTER EXPERIENCE</div>
            `;
            container.appendChild(card);
        }

        function saveRecent(key) {
            let recent = JSON.parse(localStorage.getItem('recent_brands') || '[]');

            recent.unshift(key);
            localStorage.setItem('recent_brands', JSON.stringify(recent.slice(0, 5)));

        function stopAudio() {
            if (globalAudio) {
                globalAudio.pause();
                globalAudio = null;
            }
        }

        function playBrandAudio(config) {
            if (mode === 'universal' || config.id === 'pulse') {
                stopAudio();
                return;
            }

            const audioPath = `assets/brands/${config.id}/branding/sonic.mp3`;
            stopAudio();
            globalAudio = new Audio(audioPath);
            globalAudio.loop = false;
            globalAudio.volume = 0;
            
            globalAudio.play().then(() => {
                let vol = 0;
                const fadeInterval = setInterval(() => {
                    vol += 0.02;
                    if (vol >= 0.25) {
                        globalAudio.volume = 0.25;
                        clearInterval(fadeInterval);
                    } else {
                        globalAudio.volume = vol;
                    }
                }, 100);
            }).catch(() => {
                // Silent fail (unlocked by user gesture, but still catch-all)
            });
        }

        function goToBillboard() {
            const landing = document.getElementById('stage-landing');
            const billboard = document.getElementById('stage-billboard');
            
            // Sonic Branding Trigger
            playBrandAudio(window.config);
            
            landing.classList.remove('active');
            
            setTimeout(() => {
                billboard.classList.add('active');

            document.getElementById('landing-video').style.opacity = '0';
            startBillboard();

        function startBillboard() {
            if (billboardInterval) {
                if (mode === 'universal') clearTimeout(billboardInterval);
                else clearInterval(billboardInterval);
            }
            
            if (mode === 'universal') {
                pulseLoop();
            } else {
                const config = window.config;
                updateScene();
                billboardInterval = setInterval(() => {
                    currentScene = (currentScene + 1) % config.scenes.length;
                    updateScene();
                }, 6000);
            }
        }

        function pulseLoop() {
            const config = window.config;
            const data = config.scenes[currentScene];
            updateScene();
            
            const waitTime = data.isPromo ? 10000 : 7000;
            
            billboardInterval = setTimeout(() => {
                currentScene = (currentScene + 1) % config.scenes.length;
                pulseLoop();
            }, waitTime);
        }

        function updateScene() {
            const config = window.config;
            const data = config.scenes[currentScene];
            const titleEl = document.getElementById('scene-title-text');
            const priceEl = document.getElementById('scene-price-text');
            const ctaEl = document.getElementById('cta-billboard');
            const labelEl = document.getElementById('billboard-label');
            const glowEl = document.getElementById('product-glow');
            const container = document.getElementById('product-hero-container');
            const brandTag = document.getElementById('brand-tag-overlay');
            
            container.classList.remove('show');
            titleEl.classList.remove('show');
            priceEl.classList.remove('show');
            ctaEl.classList.remove('show');
            glowEl.classList.remove('active');
            if (brandTag) brandTag.classList.remove('show');
            
            setTimeout(() => {
                labelEl.textContent = data.label;
                titleEl.textContent = data.title;
                priceEl.textContent = data.price;
                
                // Brand Name + Category Overlay
                if (mode === 'universal' && !data.isPromo) {
                    brandTag.textContent = `${data.brandName} • ${data.category}`;
                    if (data.theme) brandTag.style.color = data.theme.accent;
                    brandTag.classList.add('show');
                }

                // CTA Logic
                if (data.isPromo) {
                    ctaEl.textContent = "BOOK YOUR SLOT";
                    ctaEl.onclick = () => window.open(data.wa, '_blank');
                } else {
                    ctaEl.textContent = CATEGORIES[data.category] || "INQUIRE NOW";
                    ctaEl.onclick = openModal;
                    
                    // In universal mode, sync modal content on transition
                    if (mode === 'universal') {
                        populateModal({
                            name: data.brandName,
                            category: data.category,
                            socials: data.socials,
                            links: data.links,
                            scenes: [{ products: data.products }] 
                        });
                    }
                }

                const newImg = new Image();
                newImg.className = 'product-hero-img';
                newImg.src = data.image; // Use common image for v1
                container.innerHTML = '';
                container.appendChild(newImg);
                newImg.onerror = () => {
                   newImg.src = 'assets/system/fallback.jpg';
                   newImg.onerror = null;
                };
                titleEl.classList.add('show');
                priceEl.classList.add('show');
                ctaEl.classList.add('show');
                container.classList.add('show');
                
                // Use theme glow for background effect
                const glowColor = (data.theme && data.theme.glow) ? data.theme.glow : config.theme.glow;
                glowEl.style.background = `radial-gradient(circle, ${glowColor}44 0%, transparent 70%)`;
                glowEl.classList.add('active');
            }, 800);

            config.scenes.forEach((s, i) => {
                const bg = document.getElementById(`brand-scene-bg-${i}`);
                if (bg) bg.classList.remove('show');
            });
            const activeBg = document.getElementById(`brand-scene-bg-${currentScene}`);
            if (activeBg) activeBg.classList.add('show');
        }

        function openModal() { document.getElementById('modal-booking').classList.add('active'); }
        function closeModal() { document.getElementById('modal-booking').classList.remove('active'); }

        document.addEventListener('mousemove', (e) => {
            const overlay = document.querySelector('.atmosphere-overlay');
            if (overlay && document.getElementById('stage-landing').classList.contains('active')) {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                overlay.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        initApp();
    </script>
</body>
</html>
